name: Deploy staging

# Deploys the `staging` branch to the `admin-panel-staging` Worker. The
# production Worker is named `admin-panel`; the name is passed explicitly on
# every deploy so a missing or edited wrangler.jsonc can never cause this
# workflow to overwrite production.
on:
  # Manual only. Auto-deploy on push was switched off on 2026-09-23: work
  # lands directly on `main` now and every environment is released by hand,
  # so a push must never move a running environment on its own.
  workflow_dispatch:

concurrency:
  group: deploy-staging-admin-panel
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite inlines these at build time, so they are build inputs rather than
      # runtime config — a Worker secret would arrive too late to matter.
      - name: Build against the staging API
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.STAGING_GOOGLE_CLIENT_ID }}
          # Two variables, and that is the whole list: this panel sends no
          # analytics and no error reports anywhere (see src/main.tsx). Both
          # values below are asserted after the build, because an unset
          # `vars.X` expands to an empty string and a build with no API URL
          # deploys green and simply cannot talk to anything.
        run: npm run build

      # Cheap insurance against a build that silently picked up the wrong
      # environment: a staging deploy pointing at the production API would
      # otherwise look completely healthy.
      # Anchored on the scheme, because the staging host is
      # stage-api.startmessaging.com and a bare "api.startmessaging.com"
      # pattern is a substring of it — that check matched every staging
      # bundle and would have blocked every deploy.
      - name: Refuse to ship a bundle pointing at production
        run: |
          if grep -rqE "https://api\.startmessaging\.com" dist/assets/*.js; then
            echo "Bundle references the production API — refusing to deploy."
            exit 1
          fi
          if ! grep -rqE "https://stage-api\.startmessaging\.com" dist/assets/*.js; then
            echo "Bundle does not reference the staging API — env did not apply."
            exit 1
          fi
          echo "Bundle points at staging and not at production."

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name admin-panel-staging
